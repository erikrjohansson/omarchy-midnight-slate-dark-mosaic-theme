[bar]
background = "#101C29"
background-alpha = 0.98
text = "#CBD7E2"
active = "#CBD7E2"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "#ADC4DA"
active-border-foreground = "#ADC4DA"

[controls]
normal-color = "#CBD7E2"
normal-fill-alpha = 0.04
normal-border = "#CBD7E2"
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color = "#ADC4DA"
hover-cursor-fill-alpha = 0.08
hover-cursor-border = "#ADC4DA"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25
focus-color = "#ADC4DA"
focus-fill-alpha = 0.08
focus-border = "#ADC4DA"
focus-border-width = 1
focus-border-alpha = 0.65
selected-color = "#ADC4DA"
selected-fill-alpha = 0.18
selected-border = "#ADC4DA"
selected-border-width = 0
selected-border-alpha = 1.0
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background = "#101C29"
background-alpha = 1.0
text = "#CBD7E2"
border = "#425970"
