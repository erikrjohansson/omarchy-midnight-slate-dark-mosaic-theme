[menu]
background = "#101C29"
background-alpha = 1.0
text = "#CBD7E2"
border = "#425970"
border-alpha = 1.0
scrim = "#09111A"
scrim-alpha = 0.35
selected-background = "#354E65"
selected-background-alpha = 1.0
